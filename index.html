    if (/Unexpected end of input|missing \} |Unexpected end/i.test(m)) return "Something was opened but never closed. Check that every ( { [ and quote or backtick has a matching partner.";
    if (/missing \) after argument list/.test(m)) return "A function call is missing its closing ) or a comma between arguments.";
    if (/has already been declared|redeclaration/.test(m)) { const v = m.match(/'?(\w+)'? has already/); return `The name ${v ? v[1] : "you used"} is declared twice. Rename one, or remove the extra const / let.`; }
    if (/Invalid or unexpected token|illegal character/i.test(m)) return "There's a character JavaScript can't read. Often an unclosed string, or curly “smart” quotes pasted from a document.";
    if (/Unexpected identifier/.test(m)) return "Two words sit next to each other with nothing joining them. Look for a missing comma, operator or quote.";
    if (/Unexpected token/.test(m)) return "JavaScript found a symbol it didn't expect. Look for a missing comma, an extra bracket, or a typo near your last change.";
    return "JavaScript couldn't read this code. Check brackets, quotes and commas around your last change.";
  }
  if (/is not defined/.test(m)) { const v = m.split(" ")[0]; return `You used ${v}, but nothing with that name exists. Check the spelling (JavaScript is case-sensitive) or create it first with const or let.`; }
  if (/Assignment to constant/.test(m)) return "You tried to change a const. Use let if the value needs to change.";
  let r = m.match(/Cannot read propert(?:y|ies) of (undefined|null)(?: \(reading '([^']+)'\))?/);
  if (r) return `You tried to read ${r[2] ? "." + r[2] : "a property"} from something that is ${r[1]}. The value before the dot doesn't exist yet. Check the line, or guard it with ?.`;
  r = m.match(/Cannot access '(\w+)' before initialization/);
  if (r) return `You used ${r[1]} before the line that creates it. Move the declaration above the first use.`;
  if (/is not a function/.test(m)) return `${m.replace(" is not a function", "")} isn't a function, so it can't be called with (). Check the name, or whether it holds a value instead.`;
  if (/is not iterable/.test(m)) return "You tried to loop over or spread something that isn't an array.";
  if (/Maximum call stack/.test(m)) return "A function keeps calling itself forever. Check what stops it.";
  return "";
}

}

  const body = el(`<div><section class="section"><span class="eyebrow">Code</span><div class="codeblock">${highlight(code)}</div></section><section class="section" style="box-shadow:none"><span class="eyebrow">Line by line</span><div class="mdtext" id="ex-out"><div class="thinking"><i></i>Reading your code…</div></div></section></div>`);
  const ctrl = new AbortController();
  const foot = el(`<div style="display:contents"><span class="caption subtle">AI explanations can be wrong. Run the code to confirm.</span><button class="btn btn-subtle" id="ex-close">Done</button></div>`);
  foot.querySelector("#ex-close").onclick = () => { ctrl.abort(); closeSheet(); };
  openSheet({ icon: "sparkle", title: "Explain this code", body, foot });
  const out = $("#ex-out");
  const prompt = `You are a patient JavaScript tutor. The learner is a professional UI/UX designer learning JavaScript to prepare for React, with little coding experience.

Explain the code below line by line in plain, beginner-friendly language. For each meaningful line or small group of lines, write the code in backticks, then one or two short sentences on what it does and why. Skip blank lines and trivial closing braces. Finish with one sentence starting "In React:" that says where this pattern appears in React. Keep the whole answer under 260 words. Use only plain paragraphs, backticks and **bold**. No headings, no lists.

Lesson context: ${context}

Code:
\`\`\`js
${code}
\`\`\``;
  try {
    const res = await sampleFn(prompt, { signal: ctrl.signal, modelTier: "quick", onText: ({ text }) => { if (out.isConnected) out.innerHTML = mdLite(text); } });
    if (out.isConnected) out.innerHTML = mdLite(res.text);
  } catch (e) {
    if (!out.isConnected) return;
    const msg = e?.code === "not_granted" ? "AI explanations weren't allowed for this page. You can still use the line notes in the See step." : e?.code === "rate_limited" ? "Too many explanations in a short time. Wait a minute and try again." : "Couldn't get an explanation right now. Try again in a moment.";
    out.innerHTML = `<div class="callout bad">${ic("x")}<span>${msg}</span></div>`;
  }
}

function buildWorkspace(view, { key, files, file, snippets, context, onRunGate, onCheck, tests }) {
  const ws = el(`<div class="ws" data-m="learn">
    <section class="pane learn" aria-label="Lesson"><div class="learn-scroll"><div class="learn-body"></div></div><div class="learn-foot"></div></section>

        <button class="btn btn-ghost icon hide-md" data-a="to" aria-label="Toggle output panel" title="Toggle output panel">${ic("pright")}</button>
        <button class="btn btn-ghost explain-btn" data-a="explain" ${sampleFn ? "" : "hidden"} title="Explain the selected code, or the whole file">${ic("sparkle", 12)}Explain</button>
        <button class="btn btn-secondary icon" data-a="reset" aria-label="Reset code" title="Reset: restore the original code">${ic("reset", 13)}</button>
        <button class="btn btn-primary" data-a="run" title="Run (Ctrl + Enter)">${ic("play", 12)}Run</button>
      </div></div>
      <div class="ed-host"></div>
      <div class="ed-foot"><span class="eyebrow">Insert</span>${(snippets || []).map((s, i) => `<button class="chip" data-snip="${i}">${esc(s.replace(/\n[\s\S]*/, " …"))}</button>`).join("")}</div>
    </section>
    <section class="pane output" aria-label="Output">
      <div class="out-head"><div class="out-tabs" role="tablist"><button class="tab" data-o="console" aria-selected="true">Console</button><button class="tab" data-o="preview" aria-selected="false">Preview</button><button class="tab" data-o="tests" aria-selected="false">Tests</button></div><button class="btn btn-ghost" data-a="clear">Clear</button></div>
      <div class="out-body"></div>
      <div class="stat-grid out-foot"><div><b data-s="lines">0</b>lines</div><div><b data-s="ms">–</b>run time</div><div><b data-s="err">0</b>errors</div></div>
    </section>
  </div>`);
  const sw = el(`<div class="ws-switch" role="group" aria-label="Panel"><button data-m="learn" aria-pressed="true">Learn</button><button data-m="code" aria-pressed="false">Code</button><button data-m="out" aria-pressed="false">Output</button></div>`);
  view.append(sw, ws);
  const setMobile = (m) => { ws.dataset.m = m; $$("button", sw).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.m === m))); if (m === "code") setTimeout(() => ed.refresh(), 10); };
  sw.onclick = (e) => { const b = e.target.closest("button"); if (b) setMobile(b.dataset.m); };
  if (!store.panes.learn) ws.classList.add("no-learn");
  if (!store.panes.out) ws.classList.add("no-out");

  const drafts = (store.drafts[key] = store.drafts[key] || {});
  let cur = file;
  let last = null;
  let outTab = "console";
  const fileNames = Object.keys(files);
  const ed = createEditor($(".ed-host", ws), drafts[cur] ?? files[cur], () => api.run());
  let suppress = false;
  ed.onChange(() => { if (suppress) return; drafts[cur] = ed.get(); save(); drawFiles(); });
  const drawFiles = () => { $(".files", ws).innerHTML = fileNames.map((f) => `<button class="file" role="tab" data-f="${f}" aria-selected="${f === cur}">${f}.js${drafts[f] !== undefined && drafts[f] !== files[f] ? '<span class="mod" title="Edited"></span>' : ""}</button>`).join(""); };
  drawFiles();
  $(".files", ws).onclick = (e) => { const b = e.target.closest(".file"); if (b) api.open(b.dataset.f); };

  const body = $(".out-body", ws);
  const drawOut = () => {
    $$(".out-tabs .tab", ws).forEach((t) => t.setAttribute("aria-selected", String(t.dataset.o === outTab)));
    const r = last;
    const tabCount = (o, n) => { const t = $(`.out-tabs [data-o="${o}"]`, ws); t.innerHTML = `${o[0].toUpperCase() + o.slice(1)}${n ? `<span class="count-badge" style="min-width:20px">${n}</span>` : ""}`; };
    tabCount("console", r ? r.logs.length + r.errors.length : 0); tabCount("preview", r ? r.renders.length : 0); tabCount("tests", r && r.tests.length ? `${r.tests.filter((t) => t.pass).length}/${r.tests.length}` : 0);
    $('[data-s="lines"]', ws).textContent = r ? r.logs.length : 0;
    $('[data-s="ms"]', ws).textContent = r ? (r.timeout ? "4s+" : r.ms + " ms") : "–";
    $('[data-s="err"]', ws).textContent = r ? r.errors.length + (r.timeout ? 1 : 0) : 0;
    if (!r) { body.innerHTML = `<div class="out-empty"><b>Nothing run yet</b>Press Run or Ctrl + Enter. Output from console.log appears here, errors are explained in plain language, and render() shows a preview.</div>`; return; }
    if (outTab === "console") {
      let html = r.note ? `<div class="logrow"><span class="gut">i</span><span class="txt soft">Playground note: import and export were handled for you so both "files" run together.</span></div>` : "";
      html += r.logs.map((l, i) => `<div class="logrow ${l.type}"><span class="gut">${i + 1}</span><span class="txt">${esc(l.text)}</span></div>`).join("");
      r.errors.forEach((er) => { const f = friendly(er); html += `<div class="errbox"><div class="et">${ic("x", 12)}<b>${esc(er.name)}</b>${er.line ? `<span class="vsep"></span>Line ${er.line}` : ""}</div>${f ? `<p>${esc(f)}</p>` : ""}<span class="raw">${esc(er.message)}</span></div>`; });
      if (r.timeout) html += `<div class="errbox"><div class="et">${ic("clock", 12)}<b>Stopped after 4 seconds</b></div><p>Your code was still running. This usually means a loop whose condition never becomes false. The runner stopped it so the page stays responsive.</p></div>`;

    } else {

    }
  };

  drawOut();

  ws.addEventListener("click", (e) => {
    const a = e.target.closest("[data-a]")?.dataset.a;
    const snip = e.target.closest("[data-snip]");
    if (snip) ed.insert(snippets[+snip.dataset.snip]);
    if (!a) return;
    if (a === "run") api.run();

    if (a === "clear") { last = null; drawOut(); }
    if (a === "tl") { store.panes.learn = !store.panes.learn; ws.classList.toggle("no-learn", !store.panes.learn); save(); setTimeout(() => ed.refresh(), 20); }
    if (a === "to") { store.panes.out = !store.panes.out; ws.classList.toggle("no-out", !store.panes.out); save(); setTimeout(() => ed.refresh(), 20); }
    if (a === "explain" && sampleFn) { const sel = ed.selection(); explainCode(sel && sel.trim() ? sel : ed.get(), context); }
  });

  let running = false;
  const api = {
    ws,
    get file() { return cur; },
    learn: $(".learn-body", ws), foot: $(".learn-foot", ws), learnScroll: $(".learn-scroll", ws),
    editor: ed,
    open(f) { if (!files[f] && files[f] !== "") return; cur = f; suppress = true; ed.set(drafts[f] ?? files[f]); suppress = false; ed.clear(); drawFiles(); api.onFile?.(f); },
    setCode(v) { suppress = true; ed.set(v); suppress = false; drafts[cur] = v; save(); drawFiles(); },
    async run({ check = false } = {}) {
      if (running) return null;
      if (onRunGate && !onRunGate(cur, check)) return null;
      running = true;
      const btn = $('[data-a="run"]', ws); btn.disabled = true;
      ed.clear("line-err");
      const t = check ? tests || [] : [];

      last = r; running = false; btn.disabled = false;
      outTab = check ? "tests" : r.errors.length || r.timeout ? "console" : r.renders.length && !r.logs.length ? "preview" : "console";

      if (window.matchMedia("(max-width: 760px)").matches) setMobile("out");
      r.errors.forEach((er) => er.line && ed.mark(er.line, "line-err"));
      bumpActivity();
      if (check && onCheck) onCheck(r);
      return r;
    },
    setMobile,
    destroy() {},
  };
  setTimeout(() => ed.refresh(), 30);
  return api;
}

      $("#bo-rows", v).innerHTML = rows.map(([lb, f, col]) => { const ops = f(n); const w = Math.max(1, (Math.log10(ops + 1) / 10) * 100); return `<div style="display:grid;grid-template-columns:72px minmax(0,1fr) 56px;gap:8px;align-items:center"><span class="vlabel" style="width:auto">${lb}</span><span style="height:8px;border-radius:2px;background:rgba(255,255,255,.06);overflow:hidden"><span style="display:block;height:100%;width:${w}%;background:${col};border-radius:2px;transition:width .2s"></span></span><span class="mono tnum" style="font-size:11.5px;text-align:right;color:var(--soft)">${fmtN(ops)}</span></div>`; }).join("");
      $("#bo-cap", v).textContent = n > 1 ? `At this size, O(n²) does ${fmtN(n)}× more work than O(n). Bars use a log scale.` : "Drag to grow n. Bars use a log scale.";
    };
    $("#bo-r", v).oninput = draw;
    draw();
    return v;
  },
  "d9-sliding"() {
    const data = [3, 8, 2, 9, 4, 7, 1], k = 3;
    const v = el(`<div class="viz"><div class="viz-h"><span class="eyebrow">Visual · a window of 3 days</span><div style="display:flex;gap:6px"><button class="btn btn-secondary" data-v="next">Slide →</button><button class="btn btn-ghost" data-v="reset">Reset</button></div></div><div class="vrow" id="sw-row"></div><span class="vcap" id="sw-cap"></span></div>`);
    let start = 0, sum = data.slice(0, k).reduce((a, b) => a + b, 0), best = sum, note = "First window: add the first 3 days.";
    const draw = () => {
      $("#sw-row", v).innerHTML = `<span class="vlabel">visits</span>` + data.map((x, i) => `<span class="vchip ${i >= start && i < start + k ? "kept" : ""}">${x}</span>`).join("");
      $("#sw-cap", v).innerHTML = `${note} Sum <b style="color:var(--foreground)">${sum}</b> · best so far <b style="color:var(--foreground)">${best}</b>`;
    };
    v.onclick = (e) => {
      const a = e.target.closest("[data-v]")?.dataset.v; if (!a) return;
      if (a === "reset") { start = 0; sum = data.slice(0, k).reduce((x, y) => x + y, 0); best = sum; note = "First window: add the first 3 days."; }
      else if (start + k < data.length) { const out = data[start], inn = data[start + k]; start++; sum += inn - out; best = Math.max(best, sum); note = `+${inn} entering, −${out} leaving.`; }
      else note = "The window reached the end.";
      draw();
    };
    draw();
    return v;
  },
  "d11-stack"() {
    const pages = ["Home", "Lessons", "Stacks", "Queues", "Graphs"];
    const v = el(`<div class="viz"><div class="viz-h"><span class="eyebrow">Visual · push and pop from the top</span><div style="display:flex;gap:6px"><button class="btn btn-secondary" data-v="push">push()</button><button class="btn btn-secondary" data-v="pop">pop()</button></div></div><div id="st-col" style="display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-height:40px"></div><span class="vcap" id="st-cap">The newest item sits on top. pop() always takes it first.</span></div>`);
    const stack = ["Home"];
    const draw = (fresh) => { $("#st-col", v).innerHTML = stack.length ? [...stack].reverse().map((p, i) => `<span class="vchip ${i === 0 ? "out" : ""}" ${i === 0 && fresh ? "" : 'style="animation:none"'}>${i === 0 ? "top → " : ""}"${esc(p)}"</span>`).join("") : `<span class="faint caption">Empty stack</span>`; };
    v.onclick = (e) => {
      const a = e.target.closest("[data-v]")?.dataset.v; if (!a) return;
      if (a === "push") { if (stack.length < pages.length) { const p = pages[stack.length]; stack.push(p); $("#st-cap", v).textContent = `push("${p}") put it on top.`; } else $("#st-cap", v).textContent = "That's every page in this demo. Try pop()."; }
      else { const p = stack.pop(); $("#st-cap", v).textContent = p ? `pop() removed "${p}": last in, first out.` : "pop() on an empty stack returns undefined."; }
      draw(a === "push");
    };
    draw(false);
    return v;
  },
  "d12-binary"() {
    const ids = [3, 8, 15, 21, 34, 42, 57, 66, 79, 91];
    const v = el(`<div class="viz"><div class="viz-h"><span class="eyebrow">Visual · halve the range each step</span><div style="display:flex;gap:6px;flex-wrap:wrap"><select class="vsel" aria-label="Target">${[66, 3, 91, 50].map((t) => `<option value="${t}">target ${t}</option>`).join("")}</select><button class="btn btn-secondary" data-v="step">Next step</button></div></div><div class="vrow" id="bs-row"></div><span class="vcap" id="bs-cap"></span></div>`);
    let target = 66, low, high, mid, steps, done;
    const reset = () => { low = 0; high = ids.length - 1; mid = -1; steps = 0; done = false; draw("low and high cover the whole list. Press Next step."); };
    const draw = (msg) => {
      $("#bs-row", v).innerHTML = ids.map((x, i) => { const out = i < low || i > high; const isMid = i === mid; return `<span class="vchip ${out ? "gone" : ""} ${isMid && done && x === target ? "kept" : ""}" style="${isMid && !(done && x === target) ? "box-shadow:inset 0 0 0 1px var(--foreground)" : ""}">${x}</span>`; }).join("");
      $("#bs-cap", v).innerHTML = msg;
    };
    v.querySelector("select").onchange = (e) => { target = +e.target.value; reset(); };
    v.onclick = (e) => {
      if (e.target.closest("[data-v]")?.dataset.v !== "step") return;
      if (done) return reset();
      if (low > high) { done = true; return draw(`The range is empty after ${steps} steps, so ${target} isn't in the list: return -1. Press again to restart.`); }
      mid = Math.floor((low + high) / 2); steps++;
      const val = ids[mid];
      if (val === target) { done = true; return draw(`Step ${steps}: middle is ${val}. Found at index ${mid} in ${steps} steps instead of ${mid + 1}. Press again to restart.`); }
      if (val < target) { low = mid + 1; draw(`Step ${steps}: middle is ${val}, smaller than ${target}. Everything up to it is ruled out.`); }
      else { high = mid - 1; draw(`Step ${steps}: middle is ${val}, bigger than ${target}. Everything from it up is ruled out.`); }
    };
    reset();
    return v;
  },
};

/* ---------- Lesson view ---------- */
function viewLesson(id) {
  const L = LESSON[id]; const M = MODULES[L.module - 1];
  store.lastLesson = id; save();
  let step = store.steps[id] || "understand";
  const done = () => lessonDone(id);
  const view = frame({
    title: L.title, crumb: `${String(L.tIndex + 1).padStart(2, "0")} · ${M.name}`,
    pill: done() ? pillHtml("Completed") : store.attempts["p-" + id] || store.predictions["q-" + id] ? pillHtml("In progress", "prim") : pillHtml(`${L.minutes} min`, "idle"),
    tabs: STEPS.map((s) => ({ id: s.id, label: stepLabel(s, L) })), active: step, onTab: (t) => setStep(t),
  });
  const files = { example: L.code + "\n", predict: L.predict.code + "\n", challenge: L.practice.starter };
  const firstFile = STEPS.find((s) => s.id === step).file || "example";
  const qid = "q-" + id, pid = "p-" + id;
  const ws = buildWorkspace(view, {
    key: id, files, file: firstFile, snippets: SNIPPETS[L.module], tests: L.practice.tests,
    context: `${M.name} → ${L.title}`,
    onRunGate: (f) => { if (f === "predict" && !store.predictions[qid] && !L.predict.code.trim().startsWith("//")) { toast("Make your prediction first, then run it to check."); if (step !== "predict") setStep("predict"); ws.setMobile("learn"); return false; } return true; },
    onCheck: (r) => {
      store.attempts[pid] = (store.attempts[pid] || 0) + 1;
      const pass = !r.errors.length && r.tests.length === L.practice.tests.length && r.tests.every((t) => t.pass);
      const wasDone = done();
      if (pass) store.passed[pid] = true;
      addRecent({ id: pid, result: pass ? "passed" : "failed" });
      save();
      practiceResult = { pass, r, first: pass && !wasDone };
      if (step === "practice") renderStep();
      if (pass && !wasDone) { toast("Lesson complete. Nice work."); renderSidebar(); $(".hdr .pill")?.replaceWith(el(pillHtml("Completed"))); }
    },
  });
  activeWs = ws;
  let practiceResult = null;
  let hintOpen = false;
  ws.onFile = (f) => { ws.editor.clear("line-hl"); };

  function setStep(s) {
    step = s; store.steps[id] = s; save();
    $$(".tabs .tab", main).forEach((t) => t.setAttribute("aria-selected", String(t.dataset.id === s)));
    const f = STEPS.find((x) => x.id === s).file;
    if (f && f !== ws.file) ws.open(f);
    renderStep();
    ws.learnScroll.scrollTop = 0;
    ws.setMobile("learn");
  }
  function foot() {
    const i = STEPS.findIndex((s) => s.id === step);
    const prev = STEPS[i - 1], next = STEPS[i + 1];
    const nl = LESSONS[L.index + 1]?.track === L.track ? LESSONS[L.index + 1] : null;
    ws.foot.innerHTML = `<span class="step-meta tnum">Step ${i + 1} of ${STEPS.length}</span><div class="grp">${prev ? `<button class="btn btn-subtle" data-n="${prev.id}">${ic("chevl", 12)}Back</button>` : `<button class="btn btn-subtle" data-go="lessons">All lessons</button>`}${next ? `<button class="btn btn-primary" data-n="${next.id}">Next: ${esc(stepLabel(next, L))}${ic("chevr", 12)}</button>` : nl ? `<button class="btn btn-primary" data-go="lesson-${nl.id}" ${done() ? "" : 'title="You can move on, but the lesson is complete once practice passes"'}>Next lesson${ic("chevr", 12)}</button>` : `<button class="btn btn-primary" data-go="progress">See your readiness${ic("chevr", 12)}</button>`}</div>`;
  }
  ws.foot.onclick = (e) => { const n = e.target.closest("[data-n]"); if (n) setStep(n.dataset.n); const g = e.target.closest("[data-go]"); if (g) { if (g.dataset.go.startsWith("lesson-")) store.steps[g.dataset.go.slice(7)] = store.steps[g.dataset.go.slice(7)] || "understand"; go(g.dataset.go); } };

  function renderStep() {
    const B = ws.learn; B.innerHTML = "";
    const eyebrow = (t) => `<span class="eyebrow soft">${t}</span>`;
    if (step === "understand") {
      B.innerHTML = `${eyebrow("Understand")}<h2>${esc(L.title)}</h2>${L.understand}<div class="callout">${ic("code")}<span>The editor already holds a working example. Press <strong>Run</strong> any time to see what it prints, then continue to <strong>See</strong> for a line-by-line walkthrough.</span></div>`;
    } else if (step === "see") {
      B.innerHTML = `${eyebrow("See it work")}<h2>Walk through the example</h2><p>Each note matches a line in the editor. Click one to highlight that line.</p><div class="notes">${L.notes.map((n, i) => `<button class="note" data-l="${n.line}" data-i="${i}"><span class="ln">L${n.line}</span><span>${esc(n.text)}</span></button>`).join("")}</div>`;
      if (VIZ[id]) B.appendChild(VIZ[id]());
      B.onclick = (e) => { const n = e.target.closest(".note"); if (!n) return; if (ws.file !== "example") ws.open("example"); ws.editor.clear("line-hl"); ws.editor.mark(+n.dataset.l, "line-hl"); $$(".note", B).forEach((x) => x.classList.toggle("on", x === n)); };
    } else if (step === "experiment") {
      const t = (store.tries[id] = store.tries[id] || {});
      B.innerHTML = `${eyebrow("Experiment")}<h2>Change it and break it</h2><p>Edit the example and press <strong>Run</strong>. Errors are part of the lesson: each one is explained in plain language in Output.</p><div class="tries">${L.tries.map((x, i) => `<button class="try ${t[i] ? "done" : ""}" data-t="${i}"><span class="box">${ic("check", 10)}</span><span>${esc(x)}</span></button>`).join("")}</div><div class="callout">${ic("reset")}<span>Lost your way? <strong>Reset</strong> restores the original example.</span></div>`;
      if (VIZ[id] && ["m4-map", "m4-filter", "d8-bigo", "d9-sliding", "d11-stack", "d12-binary"].includes(id)) B.appendChild(VIZ[id]());
      B.onclick = (e) => { const b = e.target.closest(".try"); if (!b) return; t[b.dataset.t] = !t[b.dataset.t]; b.classList.toggle("done", !!t[b.dataset.t]); save(); };
    } else if (step === "predict") {
      const ans = store.predictions[qid];
      const isQuiz = L.predict.code.trim().startsWith("//");
      B.innerHTML = `${eyebrow("Predict the output")}<h2>${isQuiz ? "Pick the right line" : "What will this print?"}</h2><p>${isQuiz ? "Read predict.js in the editor, then choose an answer." : "Read predict.js in the editor. Decide before you run it: predicting is how you learn to read code without running it, which is exactly what you'll do with AI-generated code."}</p><div class="opts">${L.predict.options.map((o, i) => `<button class="opt ${ans ? (i === L.predict.answer ? "right" : i === ans.choice ? "wrong" : "") : ""}" data-o="${i}" ${ans ? "disabled" : ""}><span class="key">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>`;
      if (ans) {
        const r = el(`<div class="reveal"><div class="callout ${ans.correct ? "ok" : "bad"}">${ic(ans.correct ? "check" : "x")}<span><strong>${ans.correct ? "Correct." : "Not quite."}</strong> ${esc(L.predict.why)}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${isQuiz ? "" : `<button class="btn btn-secondary" data-a2="run">${ic("play", 12)}Run it to confirm</button>`}<button class="btn btn-ghost" data-a2="retry">Try again</button></div></div>`);
        B.appendChild(r);
      }
      B.onclick = (e) => {
        const o = e.target.closest(".opt"); const a2 = e.target.closest("[data-a2]")?.dataset.a2;
        if (o && !store.predictions[qid]) { const choice = +o.dataset.o; const correct = choice === L.predict.answer; store.predictions[qid] = { choice, correct }; addRecent({ id: qid, result: correct ? "correct" : "wrong" }); bumpActivity(); save(); renderStep(); renderSidebar(); }
        if (a2 === "run") { if (ws.file !== "predict") ws.open("predict"); ws.run(); }
        if (a2 === "retry") { delete store.predictions[qid]; save(); renderStep(); }
      };
    } else if (step === "practice") {
      const pr = practiceResult;
      const tested = pr ? Object.fromEntries(pr.r.tests.map((t) => [t.name, t.pass])) : {};
      B.innerHTML = `${eyebrow("Practice")}<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2>${esc(L.name)}</h2>${done() ? tag("Passed", "t-green", true) : store.attempts[pid] ? tag(`${store.attempts[pid]} ${store.attempts[pid] === 1 ? "try" : "tries"}`, "t-amber", true) : ""}</div>${L.practice.task}<span class="eyebrow faint" style="margin-top:4px">Tests</span><div class="testlist">${L.practice.tests.map((t) => `<div class="trow"><span class="tdot ${t.name in tested ? (tested[t.name] ? "pass" : "fail") : ""}"></span><span>${esc(t.name)}</span></div>`).join("")}</div>`;
      if (pr) B.appendChild(el(`<div class="reveal"><div class="callout ${pr.pass ? "ok" : "bad"}">${ic(pr.pass ? "check" : "x")}<span>${pr.pass ? `<strong>All tests pass.</strong> ${pr.first ? "This lesson is now complete." : "Still solid."}` : pr.r.errors.length ? "<strong>Your code threw an error</strong>, so the tests couldn't run. Check Console for a plain-language explanation." : pr.r.timeout ? "<strong>Your code didn't finish.</strong> Look for a loop that never ends." : `<strong>${pr.r.tests.filter((t) => t.pass).length} of ${L.practice.tests.length} tests pass.</strong> Read the red ones, adjust, and check again.`}</span></div></div>`));
      const actions = el(`<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-a2="check">${ic("check", 12)}Check solution</button><button class="btn btn-ghost" data-a2="hint">${ic("bulb", 12)}${hintOpen ? "Hide hint" : "Hint"}</button>${store.attempts[pid] && !done() || done() ? `<button class="btn btn-ghost" data-a2="sol">${ic("eye", 12)}Show solution</button>` : ""}${pr && pr.pass ? `<button class="btn btn-secondary" data-a2="react">${esc(stepLabel(STEPS[5], L))}${ic("chevr", 12)}</button>` : ""}</div>`);
      B.appendChild(actions);
      if (hintOpen) B.appendChild(el(`<div class="callout reveal">${ic("bulb")}<span>${esc(L.practice.hint)}</span></div>`));
      B.onclick = (e) => {
        const a2 = e.target.closest("[data-a2]")?.dataset.a2;
        if (a2 === "check") { if (ws.file !== "challenge") ws.open("challenge"); ws.run({ check: true }); }
        if (a2 === "hint") { hintOpen = !hintOpen; renderStep(); }
        if (a2 === "sol") { solutionSheet(L.practice.solution, () => { if (ws.file !== "challenge") ws.open("challenge"); ws.setCode(L.practice.solution); closeSheet(); toast("Solution loaded into challenge.js. Read it, then check it."); }); }
        if (a2 === "react") setStep("react");
      };
    } else if (step === "react") {
      const isJsx = /<\/|\/>/.test(L.jsx);
      const note = isJsx ? "This is JSX, the HTML-like syntax React uses. Everything inside <code>{ }</code> is plain JavaScript, the same JavaScript you just practised." : "Plain JavaScript: the same pattern you just practised, the way it appears in a real project.";
      B.innerHTML = `${eyebrow(stepLabel(STEPS[5], L))}<h2>${L.track === "dsa" ? "Where you'll use this in real code" : "Where you'll use this in React"}</h2>${L.react}<div class="codeblock">${highlight(L.jsx, "jsx")}</div><p class="soft" style="font-size:13px">${note}</p>${done() ? "" : `<div class="callout">${ic("target")}<span>Pass the <strong>Practice</strong> tests to complete this lesson.</span></div>`}`;
    }
    foot();
  }
  renderStep();
  ws.open(firstFile);
}
function solutionSheet(code, onUse) {
  const body = el(`<div><section class="section" style="box-shadow:none"><span class="eyebrow">Reference solution</span><div class="codeblock">${highlight(code)}</div><p class="soft" style="font-size:13px">Compare it with your attempt line by line. Understanding why it works matters more than typing it.</p></section></div>`);
  const foot = el(`<div style="display:contents"><span class="caption subtle">Loading replaces your current code.</span><div style="display:flex;gap:8px"><button class="btn btn-subtle" data-a="c">Close</button><button class="btn btn-primary" data-a="u">Load into editor</button></div></div>`);
  foot.onclick = (e) => { const a = e.target.closest("[data-a]")?.dataset.a; if (a === "c") closeSheet(); if (a === "u") onUse(); };

}

    const n = nextCh();
    ws.foot.innerHTML = `<button class="btn-link" data-go="practice">Back to Practice Arena</button>${n ? `<button class="btn btn-primary" data-go="ch-${n.id}">Next challenge${ic("chevr", 12)}</button>` : ""}`;
  }
  ws.learn.onclick = (e) => {
    const o = e.target.closest(".opt"); const a2 = e.target.closest("[data-a2]")?.dataset.a2; const g = e.target.closest("[data-go]");
    if (g) return go(g.dataset.go);
    if (o && isPred && !store.predictions[cid]) { const choice = +o.dataset.o; const correct = choice === c.predict.answer; store.predictions[cid] = { choice, correct }; addRecent({ id: cid, result: correct ? "correct" : "wrong" }); bumpActivity(); save(); draw(); renderSidebar(); }
    if (a2 === "run") ws.run();
    if (a2 === "retry") { delete store.predictions[cid]; save(); draw(); }
    if (a2 === "check") ws.run({ check: true });
    if (a2 === "hint") { hintOpen = !hintOpen; draw(); }
    if (a2 === "sol") solutionSheet(c.solution, () => { ws.setCode(c.solution); closeSheet(); toast("Solution loaded. Compare it with the bug, then check."); });
  };
  ws.foot.onclick = (e) => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); };
  draw();
}

/* ---------- boot ---------- */
route_();
})();
</script>
</body>
</html>
