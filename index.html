    key: "ch-" + cid, files, file: Object.keys(files)[0], snippets: SNIPPETS[c.module], tests: c.tests,
    context: `${cat.label} challenge: ${c.title} (${L.title})`,
    onRunGate: () => { if (isPred && !store.predictions[cid] && !c.predict.code.trim().startsWith("//")) { toast("Choose an answer first, then run it to check."); ws.setMobile("learn"); return false; } return true; },
    onCheck: (r) => {
      store.attempts[cid] = (store.attempts[cid] || 0) + 1;
      const pass = !r.errors.length && r.tests.length === c.tests.length && r.tests.every((t) => t.pass);
      const was = store.passed[cid]; if (pass) store.passed[cid] = true;
      addRecent({ id: cid, result: pass ? "passed" : "failed" }); save();
      result = { pass, r }; draw();
      if (pass && !was) { toast(c.type === "bug" ? "Bug fixed." : "Challenge passed."); renderSidebar(); }
    },
  });
  activeWs = ws;
  const nextCh = () => { const pool = CHALLENGES.filter((x) => x.cat === c.cat && x.id !== cid && x.type !== "practice"); return pool.find((x) => chStatus(x)[0] === "Not attempted") || pool[(pool.indexOf(c) + 1) % pool.length] || pool[0]; };
  function draw() {
    const B = ws.learn;
    const head = `<div style="display:flex;gap:6px;flex-wrap:wrap">${tag(cat.label, cat.tone, true)}${tag(M.name, "", true)}</div><h2>${esc(c.title)}</h2>`;
    if (isPred) {
      const ans = store.predictions[cid]; const isQuiz = c.predict.code.trim().startsWith("//");
      B.innerHTML = `${head}<p>${isQuiz ? "Read the editor and choose the right answer." : "Read the code in the editor. What does it print? Decide first, then run it."}</p><div class="opts">${c.predict.options.map((o, i) => `<button class="opt ${ans ? (i === c.predict.answer ? "right" : i === ans.choice ? "wrong" : "") : ""}" data-o="${i}" ${ans ? "disabled" : ""}><span class="key">${"ABCD"[i]}</span>${esc(o)}</button>`).join("")}</div>${ans ? `<div class="reveal"><div class="callout ${ans.correct ? "ok" : "bad"}">${ic(ans.correct ? "check" : "x")}<span><strong>${ans.correct ? "Correct." : "Not quite."}</strong> ${esc(c.predict.why)}</span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${isQuiz ? "" : `<button class="btn btn-secondary" data-a2="run">${ic("play", 12)}Run to confirm</button>`}<button class="btn btn-ghost" data-a2="retry">Try again</button><button class="btn btn-ghost" data-go="lesson-${L.id}">Review lesson</button></div></div>` : ""}`;
    } else {
      const tested = result ? Object.fromEntries(result.r.tests.map((t) => [t.name, t.pass])) : {};
      B.innerHTML = `${head}${c.task}<span class="eyebrow faint" style="margin-top:4px">Tests</span><div class="testlist">${c.tests.map((t) => `<div class="trow"><span class="tdot ${t.name in tested ? (tested[t.name] ? "pass" : "fail") : ""}"></span><span>${esc(t.name)}</span></div>`).join("")}</div>${result ? `<div class="reveal"><div class="callout ${result.pass ? "ok" : "bad"}">${ic(result.pass ? "check" : "x")}<span>${result.pass ? "<strong>Fixed.</strong> Every test passes." : result.r.errors.length ? "<strong>The code still throws an error.</strong> Console explains what went wrong." : `<strong>${result.r.tests.filter((t) => t.pass).length} of ${c.tests.length} tests pass.</strong> Keep going.`}</span></div></div>` : ""}<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-primary" data-a2="check">${ic("check", 12)}Check fix</button><button class="btn btn-ghost" data-a2="hint">${ic("bulb", 12)}${hintOpen ? "Hide hint" : "Hint"}</button>${store.attempts[cid] ? `<button class="btn btn-ghost" data-a2="sol">${ic("eye", 12)}Show solution</button>` : ""}</div>${hintOpen ? `<div class="callout reveal">${ic("bulb")}<span>${esc(c.hint)}</span></div>` : ""}<p class="soft" style="font-size:13px">Concept: <button class="btn-link" style="font-size:13px" data-go="lesson-${L.id}">${esc(L.title)}</button></p>`;
    }
    const n = nextCh();
    ws.foot.innerHTML = `<button class="btn-link" data-go="practice">Back to Practice Arena</button>${n ? `<button class="btn btn-primary" data-go="ch-${n.id}">Next challenge${ic("chevr", 12)}</button>` : ""}`;
  }
  ws.learn.onclick = (e) => {
    const o = e.target.closest(".opt"); const a2 = e.target.closest("[data-a2]")?.dataset.a2; const g = e.target.closest("[data-go]");
    if (g) return go(g.dataset.go);
    if (o && isPred && !store.predictions[cid]) { const choice = +o.dataset.o; const correct = choice === c.predict.answer; store.predictions[cid] = { choice, correct }; addRecent({ id: cid, result: correct ? "correct" : "wrong" }); bumpActivity(); save(); draw(); renderSidebar(); }
    if (a2 === "run") ws.run();
    if (a2 === "retry") { delete store.predictions[cid]; save(); draw(); }
    if (a2 === "check") ws.run({ check: true });
    if (a2 === "hint") { hintOpen = !hintOpen; draw(); }
    if (a2 === "sol") solutionSheet(c.solution, () => { ws.setCode(c.solution); closeSheet(); toast("Solution loaded. Compare it with the bug, then check."); });
  };
  ws.foot.onclick = (e) => { const g = e.target.closest("[data-go]"); if (g) go(g.dataset.go); };
  draw();
}

/* ---------- boot ---------- */
route_();
})();
</script>
</body>
</html>
